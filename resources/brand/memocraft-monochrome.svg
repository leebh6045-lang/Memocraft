<path id="left-page" d="M 112,128 184,224 V 376 H 112 Z" fill="#202A44"/>
<path id="fold-left" d="M 112,128 H 184 L 256,224 V 320 L 184,224 Z" fill="#202A44"/>
<path id="fold-right" d="M 256,224 328,128 H 400 L 328,224 256,320 Z" fill="#202A44"/>
<path id="bookmark-page" d="M 328,224 400,128 V 376 L 364,354 328,376 Z" fill="#202A44"/>
</svg>
