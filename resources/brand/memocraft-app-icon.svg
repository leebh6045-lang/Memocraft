<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
<title id="title">Memocraft · 折叠记忆卡</title>
<desc id="desc">四个相连的折纸面构成字母 M，右下方的书签切口象征保存与重访记忆。</desc>
<!-- macOS 图标网格：画布 1024，底板 824 居中、四周留白 100，投影只落在留白里。
     底板是苹果连续圆角（圆角参数 r = 185.4，直边在距角 1.5287r 处开始弯），
     每个角三段三次贝塞尔；早先的超椭圆路径角太方，程序坞里显得比系统图标大。
     M 的形状与颜色不变，按底板比例等比缩放（系数 824/464），坐标直接算进路径。
     底板轮廓逐处写全、不用 <use> 引用：sips 等栅格化工具对 <use> 的支持不可靠。 -->
<defs>
  <clipPath id="tile-clip" clipPathUnits="userSpaceOnUse">
    <path d="M 383.41 100 L 640.59 100 C 722.19 100 763.00 100 806.92 113.89 C 854.88 131.34 892.66 169.12 910.11 217.08 C 924 261.00 924 301.81 924 383.41 L 924 640.59 C 924 722.19 924 763.00 910.11 806.92 C 892.66 854.88 854.88 892.66 806.92 910.11 C 763.00 924 722.19 924 640.59 924 L 383.41 924 C 301.81 924 261.00 924 217.08 910.11 C 169.12 892.66 131.34 854.88 113.89 806.92 C 100 763.00 100 722.19 100 640.59 L 100 383.41 C 100 301.81 100 261.00 113.89 217.08 C 131.34 169.12 169.12 131.34 217.08 113.89 C 261.00 100 301.81 100 383.41 100 Z"/>
  </clipPath>
  <!-- 底板面色以原色 #202A44 为中段，上提亮、下压暗，模拟从上受光 -->
  <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2e3b5e"/>
    <stop offset="0.5" stop-color="#202A44"/>
    <stop offset="1" stop-color="#161d31"/>
  </linearGradient>
  <!-- 顶沿内侧高光：只在上部三成可见，给出"边缘被光照到"的厚度 -->
  <linearGradient id="rim" gradientUnits="userSpaceOnUse" x1="0" y1="100" x2="0" y2="360">
    <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
    <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="inner-dark" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#05070d" stop-opacity="0"/>
    <stop offset="1" stop-color="#05070d" stop-opacity="0.22"/>
  </linearGradient>
</defs>
<!-- 外投影：底板同形逐层下移并略微放大、透明度递减，叠出柔和的扩散阴影。
     不用高斯模糊（sips 会把模糊裁在包围盒内），也不用渐变（位移会带走渐变，渲染成硬边灰条）。
     最外层下沿约 953、两侧约 932，仍在 100 的留白之内。 -->
<g fill="#0b1020">
  <path fill-opacity="0.02" transform="translate(512 533) scale(1.020) translate(-512 -512)" d="M 383.41 100 L 640.59 100 C 722.19 100 763.00 100 806.92 113.89 C 854.88 131.34 892.66 169.12 910.11 217.08 C 924 261.00 924 301.81 924 383.41 L 924 640.59 C 924 722.19 924 763.00 910.11 806.92 C 892.66 854.88 854.88 892.66 806.92 910.11 C 763.00 924 722.19 924 640.59 924 L 383.41 924 C 301.81 924 261.00 924 217.08 910.11 C 169.12 892.66 131.34 854.88 113.89 806.92 C 100 763.00 100 722.19 100 640.59 L 100 383.41 C 100 301.81 100 261.00 113.89 217.08 C 131.34 169.12 169.12 131.34 217.08 113.89 C 261.00 100 301.81 100 383.41 100 Z"/>
  <path fill-opacity="0.03" transform="translate(512 528) scale(1.016) translate(-512 -512)" d="M 383.41 100 L 640.59 100 C 722.19 100 763.00 100 806.92 113.89 C 854.88 131.34 892.66 169.12 910.11 217.08 C 924 261.00 924 301.81 924 383.41 L 924 640.59 C 924 722.19 924 763.00 910.11 806.92 C 892.66 854.88 854.88 892.66 806.92 910.11 C 763.00 924 722.19 924 640.59 924 L 383.41 924 C 301.81 924 261.00 924 217.08 910.11 C 169.12 892.66 131.34 854.88 113.89 806.92 C 100 763.00 100 722.19 100 640.59 L 100 383.41 C 100 301.81 100 261.00 113.89 217.08 C 131.34 169.12 169.12 131.34 217.08 113.89 C 261.00 100 301.81 100 383.41 100 Z"/>
  <path fill-opacity="0.04" transform="translate(512 524) scale(1.012) translate(-512 -512)" d="M 383.41 100 L 640.59 100 C 722.19 100 763.00 100 806.92 113.89 C 854.88 131.34 892.66 169.12 910.11 217.08 C 924 261.00 924 301.81 924 383.41 L 924 640.59 C 924 722.19 924 763.00 910.11 806.92 C 892.66 854.88 854.88 892.66 806.92 910.11 C 763.00 924 722.19 924 640.59 924 L 383.41 924 C 301.81 924 261.00 924 217.08 910.11 C 169.12 892.66 131.34 854.88 113.89 806.92 C 100 763.00 100 722.19 100 640.59 L 100 383.41 C 100 301.81 100 261.00 113.89 217.08 C 131.34 169.12 169.12 131.34 217.08 113.89 C 261.00 100 301.81 100 383.41 100 Z"/>
  <path fill-opacity="0.05" transform="translate(512 520) scale(1.008) translate(-512 -512)" d="M 383.41 100 L 640.59 100 C 722.19 100 763.00 100 806.92 113.89 C 854.88 131.34 892.66 169.12 910.11 217.08 C 924 261.00 924 301.81 924 383.41 L 924 640.59 C 924 722.19 924 763.00 910.11 806.92 C 892.66 854.88 854.88 892.66 806.92 910.11 C 763.00 924 722.19 924 640.59 924 L 383.41 924 C 301.81 924 261.00 924 217.08 910.11 C 169.12 892.66 131.34 854.88 113.89 806.92 C 100 763.00 100 722.19 100 640.59 L 100 383.41 C 100 301.81 100 261.00 113.89 217.08 C 131.34 169.12 169.12 131.34 217.08 113.89 C 261.00 100 301.81 100 383.41 100 Z"/>
  <path fill-opacity="0.06" transform="translate(512 517) scale(1.004) translate(-512 -512)" d="M 383.41 100 L 640.59 100 C 722.19 100 763.00 100 806.92 113.89 C 854.88 131.34 892.66 169.12 910.11 217.08 C 924 261.00 924 301.81 924 383.41 L 924 640.59 C 924 722.19 924 763.00 910.11 806.92 C 892.66 854.88 854.88 892.66 806.92 910.11 C 763.00 924 722.19 924 640.59 924 L 383.41 924 C 301.81 924 261.00 924 217.08 910.11 C 169.12 892.66 131.34 854.88 113.89 806.92 C 100 763.00 100 722.19 100 640.59 L 100 383.41 C 100 301.81 100 261.00 113.89 217.08 C 131.34 169.12 169.12 131.34 217.08 113.89 C 261.00 100 301.81 100 383.41 100 Z"/>
  <path fill-opacity="0.08" transform="translate(0 2)" d="M 383.41 100 L 640.59 100 C 722.19 100 763.00 100 806.92 113.89 C 854.88 131.34 892.66 169.12 910.11 217.08 C 924 261.00 924 301.81 924 383.41 L 924 640.59 C 924 722.19 924 763.00 910.11 806.92 C 892.66 854.88 854.88 892.66 806.92 910.11 C 763.00 924 722.19 924 640.59 924 L 383.41 924 C 301.81 924 261.00 924 217.08 910.11 C 169.12 892.66 131.34 854.88 113.89 806.92 C 100 763.00 100 722.19 100 640.59 L 100 383.41 C 100 301.81 100 261.00 113.89 217.08 C 131.34 169.12 169.12 131.34 217.08 113.89 C 261.00 100 301.81 100 383.41 100 Z"/>
</g>
<path id="background" fill="url(#face)" d="M 383.41 100 L 640.59 100 C 722.19 100 763.00 100 806.92 113.89 C 854.88 131.34 892.66 169.12 910.11 217.08 C 924 261.00 924 301.81 924 383.41 L 924 640.59 C 924 722.19 924 763.00 910.11 806.92 C 892.66 854.88 854.88 892.66 806.92 910.11 C 763.00 924 722.19 924 640.59 924 L 383.41 924 C 301.81 924 261.00 924 217.08 910.11 C 169.12 892.66 131.34 854.88 113.89 806.92 C 100 763.00 100 722.19 100 640.59 L 100 383.41 C 100 301.81 100 261.00 113.89 217.08 C 131.34 169.12 169.12 131.34 217.08 113.89 C 261.00 100 301.81 100 383.41 100 Z"/>
<g clip-path="url(#tile-clip)">
  <rect x="100" y="640" width="824" height="284" fill="url(#inner-dark)"/>
  <!-- 描边宽 8、被底板裁掉外半圈，留下内侧 4px 的高光线 -->
  <path fill="none" stroke="url(#rim)" stroke-width="8" d="M 383.41 100 L 640.59 100 C 722.19 100 763.00 100 806.92 113.89 C 854.88 131.34 892.66 169.12 910.11 217.08 C 924 261.00 924 301.81 924 383.41 L 924 640.59 C 924 722.19 924 763.00 910.11 806.92 C 892.66 854.88 854.88 892.66 806.92 910.11 C 763.00 924 722.19 924 640.59 924 L 383.41 924 C 301.81 924 261.00 924 217.08 910.11 C 169.12 892.66 131.34 854.88 113.89 806.92 C 100 763.00 100 722.19 100 640.59 L 100 383.41 C 100 301.81 100 261.00 113.89 217.08 C 131.34 169.12 169.12 131.34 217.08 113.89 C 261.00 100 301.81 100 383.41 100 Z"/>
</g>
<!-- 纸面投影：M 外轮廓逐层下移、透明度递减，让折纸像是浮在底板上 -->
<path fill="#05070d" fill-opacity="0.08" transform="translate(0 26)" d="M 256.28,284.69 H 384.14 L 512.00,455.17 639.86,284.69 H 767.72 V 725.10 L 703.79,686.03 639.86,725.10 V 455.17 L 512.00,625.66 384.14,455.17 V 725.10 H 256.28 Z"/>
<path fill="#05070d" fill-opacity="0.12" transform="translate(0 15)" d="M 256.28,284.69 H 384.14 L 512.00,455.17 639.86,284.69 H 767.72 V 725.10 L 703.79,686.03 639.86,725.10 V 455.17 L 512.00,625.66 384.14,455.17 V 725.10 H 256.28 Z"/>
<path fill="#05070d" fill-opacity="0.2" transform="translate(0 6)" d="M 256.28,284.69 H 384.14 L 512.00,455.17 639.86,284.69 H 767.72 V 725.10 L 703.79,686.03 639.86,725.10 V 455.17 L 512.00,625.66 384.14,455.17 V 725.10 H 256.28 Z"/>
<!-- 四个纸面可分别选中改色；纯路径，无外部字体、图片或滤镜。 -->
<path id="left-page" d="M 256.28,284.69 384.14,455.17 V 725.10 H 256.28 Z" fill="#E0CBA9"/>
<path id="fold-left" d="M 256.28,284.69 H 384.14 L 512.00,455.17 V 625.66 L 384.14,455.17 Z" fill="#FFF4E2"/>
<path id="fold-right" d="M 512.00,455.17 639.86,284.69 H 767.72 L 639.86,455.17 512.00,625.66 Z" fill="#F4E8D2"/>
<path id="bookmark-page" d="M 639.86,455.17 767.72,284.69 V 725.10 L 703.79,686.03 639.86,725.10 Z" fill="#E0CBA9"/>
<!-- 极淡暗边，压住底板轮廓，浅色桌面上也不发虚 -->
<path fill="none" stroke="#05070d" stroke-opacity="0.25" stroke-width="2" d="M 383.41 100 L 640.59 100 C 722.19 100 763.00 100 806.92 113.89 C 854.88 131.34 892.66 169.12 910.11 217.08 C 924 261.00 924 301.81 924 383.41 L 924 640.59 C 924 722.19 924 763.00 910.11 806.92 C 892.66 854.88 854.88 892.66 806.92 910.11 C 763.00 924 722.19 924 640.59 924 L 383.41 924 C 301.81 924 261.00 924 217.08 910.11 C 169.12 892.66 131.34 854.88 113.89 806.92 C 100 763.00 100 722.19 100 640.59 L 100 383.41 C 100 301.81 100 261.00 113.89 217.08 C 131.34 169.12 169.12 131.34 217.08 113.89 C 261.00 100 301.81 100 383.41 100 Z"/>
</svg>
