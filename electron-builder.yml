appId: app.memocraft.desktop
productName: Memocraft
icon: resources/brand/memocraft-app-icon.png
# Electron 二进制与校验和改从国内镜像取（顶层配置项，不能放进 win 段）。
# GitHub 的 release 资产在国内经常被限速到 100KB/s 级别，158MB 的包会直接撞上
# electron-builder 的 10 分钟单请求超时；镜像上的校验和与官方 SHASUMS256.txt
# 逐字节一致，完整性不受影响。
electronDownload:
  mirror: https://registry.npmmirror.com/-/binary/electron/
# 需要跳过联网下载与校验的构建机（Windows）在打包命令上临时指定本地 Electron 目录，
# 不把本机路径写进本文件——写进来会让其他机器（macOS 打包）直接报 electronDist 不存在：
#   pnpm run package:win --config.electronDist=D:/Appout/.cache/electron/electron-v44.4.3-win32-x64
# 字段覆盖必须用 --config.<键>=<值>；-c.<键>=<值> 会被 electron-builder 当成配置文件路径。
# 目录名与 zip 名必须与 electron-builder 的默认预期一致：<目录>/electron-v<版本>-<平台>-<架构>.zip
directories:
  output: release
files:
  - out/**
  - package.json
extraResources:
  - from: migrations
    to: migrations
  - from: resources/brand
    to: brand
mac:
  # dir 供本机与桌面流程验证使用；dmg 是给人安装的产物。
  # artifactName 固定为「产品名-版本-架构.扩展名」，升级与排障时容易辨认。
  target:
    - dir
    - dmg
  artifactName: ${productName}-${version}-${arch}.${ext}
  category: public.app-category.productivity
  # 本机自用：不做 Developer ID 签名与公证，首次打开需要手动允许。
  identity: null
win:
  target:
    - nsis
  # 与 mac 段保持同一套命名：产品名-版本-架构，便于分发与排障。
  # 不加这一行，NSIS 默认会产出带空格的「Memocraft Setup 0.2.0.exe」。
  artifactName: ${productName}-${version}-${arch}.${ext}
# NSIS 选项是顶层配置（不是 win 的子项，放错会直接配置校验失败）。
# electron-builder 默认 oneClick=true，即一键静默安装：不渲染向导，因此没有选择
# 安装路径的机会。下面两项把它改成向导式安装，并插入「选择安装位置」页面。
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # 保持每用户安装：不需要管理员权限、不弹 UAC。代价是无法装进 Program Files，
  # 想全局安装需改成 true（届时会要求提权）。
  perMachine: false
  # 卸载向导的「数据处理方式」勾选页，以及更新器安装包暂存的清理，见该文件内说明。
  include: build/installer.nsh
